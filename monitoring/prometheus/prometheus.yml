# Person 6. Prometheus reads /metrics from every service every 5 seconds.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: validator
    static_configs:
      - targets: ["validator:8000"]
  - job_name: consumer
    static_configs:
      - targets: ["consumer:8000"]
  - job_name: rejected-writer
    static_configs:
      - targets: ["rejected-writer:8000"]
