# Person 2 (Database). Included by the root docker-compose.yml.
services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro   # schema + seed run on FIRST start only
      - pgdata:/var/lib/postgresql/data          # data survives restarts
    command: ["postgres", "-c", "max_connections=100", "-c", "synchronous_commit=on"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d booking_db"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
