# Ride middleware - root compose file.  Owner: Person 1 (Kafka, platform, integration)
#
#   docker compose up -d --build --wait      -> the whole platform (topics + DB migrations run automatically)
#   http://localhost:8000/live               -> book a ride and watch it live
#   http://localhost:3000                    -> Grafana
#
# Kafka: 3 brokers (KRaft), replication factor 3, min.insync.replicas 2, acks=all.
#   inside docker : kafka:29092,kafka2:29092,kafka3:29092
#   your laptop   : localhost:9092,localhost:9094,localhost:9096
# High availability: 3 brokers, 3 API copies behind HAProxy, every consumer scalable (Autopilot).
#
# Each team member owns one compose.yml; this file pulls them all in (no merge conflicts).
name: ride-middleware

include:
  - db/compose.yml                    # Person 2 - postgres + db-migrate
  - services/producer/compose.yml     # Person 3 - API (3 copies) + CSV producer
  - services/validator/compose.yml    # Person 4 - validator + dispatcher
  - services/consumer/compose.yml     # Person 5 - booking / driver / trip / payment writers + DLQ replay
  - services/simulator/compose.yml    # Person 6 - simulator + reconciler
  - monitoring/compose.yml            # Person 6 - prometheus, grafana, kafka-exporter

x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka2:9093,3@kafka3:9093
  CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
  KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  # --- no data loss ---
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3            # every message stored on all 3 brokers
  KAFKA_MIN_INSYNC_REPLICAS: 2                   # with acks=all a write needs 2 copies to succeed
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"  # never elect a replica that is missing data
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  # --- general ---
  KAFKA_NUM_PARTITIONS: 6
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
  KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"           # 3 brokers fit in ~2 GB

x-kafka-health: &kafka-health
  test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
  interval: 10s
  timeout: 10s
  retries: 15
  start_period: 25s

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
    healthcheck: *kafka-health

  kafka2:
    image: apache/kafka:3.8.0
    container_name: kafka2
    hostname: kafka2
    ports: ["9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://localhost:9094
    healthcheck:
      <<: *kafka-health
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 > /dev/null 2>&1"]

  kafka3:
    image: apache/kafka:3.8.0
    container_name: kafka3
    hostname: kafka3
    ports: ["9096:9096"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9096,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://localhost:9096
    healthcheck:
      <<: *kafka-health
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9096 > /dev/null 2>&1"]

  # One-shot: creates all topics, then exits. Every service waits for it.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    environment:
      BOOTSTRAP: kafka:29092,kafka2:29092,kafka3:29092
      PARTITIONS: ${KAFKA_PARTITIONS:-6}
      REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      MIN_ISR: ${KAFKA_MIN_ISR:-2}
    volumes:
      - ./infra/kafka/create_topics.sh:/create_topics.sh:ro
    entrypoint: ["/bin/bash", "/create_topics.sh"]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: ride-middleware
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092,kafka2:29092,kafka3:29092

  # ---------------------------------------------------------------- platform (Person 1)
  redis:                                     # shared by all API copies: idempotency, surge, velocity, node ids
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis-dev-password}",
              "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru", "--save", "", "--appendonly", "no"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redis-dev-password}
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  lb:                                        # HAProxy: the ONE public door, spreads load over API copies
    image: haproxy:3.0-alpine
    container_name: lb
    ports: ["127.0.0.1:8000:8000", "127.0.0.1:8404:8404"]
    volumes:
      - ./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      api: {condition: service_started}
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  autopilot:                                 # the unique feature: self-scaling + self-healing
    extends: {file: infra/compose/app.yml, service: app}
    container_name: autopilot
    command: ["python", "-m", "services.autopilot.autopilot"]
    user: "0:0"                              # needs the Docker socket (root inside, still no-new-privileges)
    environment:
      COMPOSE_PROJECT: ride-middleware
      PROMETHEUS_URL: http://prometheus:9090
      AUTOPILOT_INTERVAL_S: "15"
      AUTOPILOT_SCALE_UP_LAG: "1000"
      AUTOPILOT_SCALE_DOWN_LAG: "50"
      AUTOPILOT_COOLDOWN_S: "60"
      AUTOPILOT_API_RPS_PER_COPY: "300"
      AUTOPILOT_DRY_RUN: ${AUTOPILOT_DRY_RUN:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      prometheus: {condition: service_started}
