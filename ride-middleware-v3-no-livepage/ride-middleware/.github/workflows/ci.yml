# CI/CD (Person 1). Runs on every push and pull request; branch protection on `main`
# requires all jobs green before a merge. Nothing here needs secrets except GITHUB_TOKEN.
name: ci

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install ruff bandit
      - name: ruff (style + bugs + security rules)
        run: python -m ruff check .
      - name: bandit (Python security scan)
        run: python -m bandit -q -r common services db monitoring -ll -s B101,B104,B108,B110,B112,B311,B404,B603,B607,B608

  secrets-and-deps:
    name: secret scan + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: gitleaks (no passwords / keys committed, whole history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner -v
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: pip-audit (known CVEs in our pinned packages)
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt --progress-spinner off

  test:
    name: tests (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: ridehail_test, POSTGRES_USER: app, POSTGRES_PASSWORD: app}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/ridehail_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt pytest fakeredis pyyaml
      - name: migrations apply cleanly (and twice = no-op)
        run: |
          DATABASE_URL=$TEST_DATABASE_URL python -m db.migrate
          DATABASE_URL=$TEST_DATABASE_URL python -m db.migrate --status
      - name: pytest
        run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: test-results, path: test-results.xml}

  compose:
    name: compose + load balancer config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config is valid
        run: docker compose --profile tools config --quiet
      - name: haproxy.cfg is valid
        run: docker run --rm -v "$PWD/infra/haproxy:/cfg:ro" haproxy:3.0-alpine haproxy -c -f /cfg/haproxy.cfg

  image:
    name: build + scan image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: build the one app image
        run: docker build -t ride-middleware/app:ci .
      - name: image runs as non-root
        run: test "$(docker run --rm --entrypoint id ride-middleware/app:ci -u)" = "10001"
      - name: trivy (CRITICAL/HIGH CVEs with a fix available fail the build)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress ride-middleware/app:ci
      - name: publish to GitHub Container Registry (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/app
          docker tag ride-middleware/app:ci $IMG:${{ github.sha }}
          docker tag ride-middleware/app:ci $IMG:latest
          docker push $IMG:${{ github.sha }}
          docker push $IMG:latest
