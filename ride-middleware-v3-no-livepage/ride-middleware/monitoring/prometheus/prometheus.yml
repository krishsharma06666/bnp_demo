# Person 6. Scrapes every 5 s.
# dns_sd finds ALL copies of a service (3 API copies, anything the Autopilot adds) by its DNS name.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: services
    dns_sd_configs:
      - names: [api, validator, consumer, rejected-writer, dispatcher, driver-consumer, trip-consumer,
                payment-consumer, reconciler, autopilot]
        type: A
        port: 8000
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: job

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: loadbalancer
    static_configs:
      - targets: ["lb:8404"]
