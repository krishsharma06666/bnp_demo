version: '3.8'

networks:
  bnp-net:
    external: true

services:
  postgres:
    image: postgres:15-alpine
    container_name: bnp-postgres
    networks:
      - bnp-net
    environment:
      POSTGRES_DB: bnp_db
      POSTGRES_USER: bnp_user
      POSTGRES_PASSWORD: bnp_password
    ports:
      - "5432:5432"
    restart: always

  kafka:
    image: apache/kafka:latest
    container_name: bnp-kafka
    networks:
      - bnp-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://bnp-kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@bnp-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://bnp-kafka:29092,CONTROLLER://bnp-kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: bnp-prometheus
    networks:
      - bnp-net
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: public.ecr.aws/docker/library/grafana:latest
    container_name: bnp-grafana
    networks:
      - bnp-net
    ports:
      - "3000:3000"
    restart: always
