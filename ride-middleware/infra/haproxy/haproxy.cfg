# Person 1 - load balancer in front of the API copies.
#   http://localhost:8000        -> any healthy API copy (Swagger /docs, tracker /live)
#   http://localhost:8404/stats  -> which copies are UP/DOWN right now
# Copies are found through Docker DNS (name "api"), so the 3 compose copies AND any copy the
# Autopilot adds are picked up within seconds - no config change, no restart.
global
    log stdout format raw local0 info
    maxconn 8000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    timeout connect 3s
    timeout client  30s
    timeout server  30s
    timeout tunnel  1h                 # live tracker (Server-Sent Events) keeps the connection open
    retries 3
    option redispatch                  # a copy fails mid-request -> try another copy
    retry-on conn-failure empty-response

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      5s
    hold other      5s
    hold obsolete   5s
    accepted_payload_size 8192

frontend public
    bind :8000
    http-request set-header X-Request-Id %[uuid()] unless { req.hdr(X-Request-Id) -m found }
    http-response del-header Server
    default_backend api

backend api
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 check resolvers docker init-addr none
    server-template api 10 api:8000

frontend stats
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
